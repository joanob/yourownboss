version: "2"
project:
  name: "yourownboss"
sql:
  - engine: "sqlite"
    queries: "internal/**/*.sql"
    schema: "internal/db/migrations/schema.sql"
    gen:
      go:
        package: "sql"
        out: "internal"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        query_parameter_limit: 1
